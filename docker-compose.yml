# ──────────────────────────────────────────────────────────────
# wio-api :: docker-compose.yml
# Môi trường LOCAL với Docker (mặc định cho developer).
# Dev clone về chỉ cần copy các biến bên dưới vào file .env duy nhất,
# sau đó chạy: docker compose up --build
# ──────────────────────────────────────────────────────────────

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wio_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-wio-dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - api_net

  redis:
    image: redis:7-alpine
    container_name: wio_redis
    restart: always
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - api_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wio_api
    restart: always
    env_file:
      - .env
    environment:
      # Override networking cho container Docker
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-4300}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:root@postgres:5432/wio-dev}
      - TYPEORM_HOST=${TYPEORM_HOST:-postgres}
      - TYPEORM_PORT=${TYPEORM_PORT:-5432}
      - TYPEORM_USERNAME=${TYPEORM_USERNAME:-postgres}
      - TYPEORM_PASSWORD=${TYPEORM_PASSWORD:-root}
      - TYPEORM_DATABASE=${TYPEORM_DATABASE:-wio-dev}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # Telegram thông báo CI/CD (optional)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Base path cho EnvManager UI (server only)
      - ENV_MANAGER_BASE_PATH=${ENV_MANAGER_BASE_PATH:-/opt/wio}
    ports:
      - '${PORT:-4300}:4300'
    depends_on:
      - postgres
      - redis
    networks:
      - api_net

networks:
  api_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
