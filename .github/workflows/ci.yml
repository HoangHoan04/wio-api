name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  NODE_VERSION: '22'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage || '' }}
      duration: ${{ steps.duration.outputs.duration || '' }}

    steps:
      - name: Notify Telegram - In Progress
        if: github.event_name == 'push'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
          COMMIT_SHA: ${{ github.sha || '' }}
        run: |
          MSG=$(echo "${COMMIT_MSG}" | head -n1 | tr -d '\r' | sed 's/["`$]//g')
          SHA_SHORT=$(echo ${COMMIT_SHA} | cut -c1-7)
          REPO_NAME=$(echo '${{ github.repository }}' | cut -d/ -f2)
          ENV_LABEL=$(if [ "${{ github.ref_name }}" = "main" ]; then echo "PRODUCTION"; else echo "DEVELOP"; fi)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="<b>🚀 CI BUILD IN PROGRESS [${ENV_LABEL}]</b>%0A%0A<b>Repo:</b>     ${REPO_NAME}%0A<b>Người:</b>    ${{ github.actor }}%0A<b>Nhánh:</b>    ${{ github.ref_name }} (<code>${SHA_SHORT}</code>)%0A<b>Commit:</b>   ${MSG}%0A<b>Status:</b>   In Progress"

      - uses: actions/checkout@v4

      - name: Record build start time
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Linter
        run: yarn lint

      - name: Run Tests with Coverage
        id: coverage
        run: |
          yarn test --coverage --passWithNoTests 2>&1 | tee coverage-output.txt
          COVERAGE=$(grep -oP 'Lines\s*:\s*\K[\d.]+(?=%)' coverage-output.txt || echo "0")
          echo "coverage=${COVERAGE}%" >> $GITHUB_OUTPUT

      - name: Check coverage threshold
        if: always()
        env:
          COVERAGE: ${{ steps.coverage.outputs.coverage }}
        run: |
          THRESHOLD=80
          COVERAGE_NUM=$(echo "${COVERAGE}" | sed 's/%//' | cut -d. -f1)
          if [ -n "$COVERAGE_NUM" ] && [ "$COVERAGE_NUM" != "0" ] && [ "$COVERAGE_NUM" -lt "$THRESHOLD" ] 2>/dev/null; then
            REPO_NAME=$(echo '${{ github.repository }}' | cut -d/ -f2)
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d parse_mode="HTML" \
              -d text="<b>⚠️ COVERAGE DROPPED BELOW THRESHOLD</b>%0A%0A<b>Repo:</b>      ${REPO_NAME}%0A<b>Coverage:</b>  ${COVERAGE}%0A<b>Ngưỡng:</b>    ${THRESHOLD}%"
          fi

      - name: Build Application
        run: yarn build

      - name: Check build duration
        id: duration
        if: always()
        run: |
          DURATION=$(($(date +%s) - BUILD_START_TIME))
          echo "duration=${DURATION}s" >> $GITHUB_OUTPUT
          if [ $DURATION -gt 600 ]; then
            REPO_NAME=$(echo '${{ github.repository }}' | cut -d/ -f2)
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d parse_mode="HTML" \
              -d text="<b>🐢 SLOW BUILD DETECTED</b>%0A%0A<b>Repo:</b>      ${REPO_NAME}%0A<b>Nhánh:</b>    ${{ github.ref_name }}%0A<b>Duration:</b> ${DURATION}s%0A<b>Giới hạn:</b> 600s (10 phút)"
          fi

  # ─── Tự động chạy migration khi merge code vào develop / main ────────────────
  # ⚠️ ĐÃ TẮT: Migration chạy trực tiếp trên server qua docker-compose (service migration).
  # Nếu dùng Managed Database có thể kết nối từ GitHub Actions, hãy bỏ dòng `if: false` bên dưới
  # và cấu hình secrets DATABASE_URL_DEV / DATABASE_URL_PROD.
  migrate-database:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set database URL
        id: db
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "node_env=production" >> $GITHUB_OUTPUT
            echo "database_url=${{ secrets.DATABASE_URL_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "node_env=development" >> $GITHUB_OUTPUT
            echo "database_url=${{ secrets.DATABASE_URL_DEV }}" >> $GITHUB_OUTPUT
          fi

      - name: Run database migrations
        env:
          NODE_ENV: ${{ steps.db.outputs.node_env }}
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
        run: |
          echo "Running migrations with NODE_ENV=$NODE_ENV"
          yarn migration:run

      - name: Notify Telegram - Migration Result
        if: always()
        env:
          RESULT: ${{ job.status }}
          SHA_SHORT: ${{ github.sha }}
        run: |
          REPO_NAME=$(echo '${{ github.repository }}' | cut -d/ -f2)
          ENV_LABEL=$(if [ "${{ github.ref_name }}" = "main" ]; then echo "PRODUCTION"; else echo "DEVELOP"; fi)
          if [ "${RESULT}" = "success" ]; then
            ICON="✅"
            TEXT="MIGRATION SUCCESS"
          else
            ICON="❌"
            TEXT="MIGRATION FAILED"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="<b>${ICON} ${TEXT} [${ENV_LABEL}]</b>%0A%0A<b>Repo:</b>     ${REPO_NAME}%0A<b>Người:</b>    ${{ github.actor }}%0A<b>Nhánh:</b>    ${{ github.ref_name }} (<code>${SHA_SHORT:0:7}</code>)%0A<b>Status:</b>   ${RESULT}"

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-test, migrate-database]
    if: always() && github.event_name == 'push'

    steps:
      - name: Prepare commit info
        id: info
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
          COMMIT_SHA: ${{ github.sha || '' }}
        run: |
          echo "sha_short=$(echo ${COMMIT_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "msg_first=$(echo "${COMMIT_MSG}" | head -n1 | tr -d '\r' | sed 's/["`$]//g')" >> $GITHUB_OUTPUT
          echo "repo_name=$(echo '${{ github.repository }}' | cut -d/ -f2)" >> $GITHUB_OUTPUT

      - name: Notify Telegram - Success
        if: needs.build-and-test.result == 'success' && (needs.migrate-database.result == 'success' || needs.migrate-database.result == 'skipped')
        env:
          SHA: ${{ steps.info.outputs.sha_short }}
          MSG: ${{ steps.info.outputs.msg_first }}
          REPO: ${{ steps.info.outputs.repo_name }}
          COVERAGE: ${{ needs.build-and-test.outputs.coverage }}
          DURATION: ${{ needs.build-and-test.outputs.duration }}
        run: |
          ENV_LABEL=$(if [ "${{ github.ref_name }}" = "main" ]; then echo "PRODUCTION"; else echo "DEVELOP"; fi)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="<b>✅ CI BUILD SUCCESS [${ENV_LABEL}]</b>%0A%0A<b>Repo:</b>     ${REPO}%0A<b>Người:</b>    ${{ github.actor }}%0A<b>Nhánh:</b>    ${{ github.ref_name }} (<code>${SHA}</code>)%0A<b>Commit:</b>   ${MSG}%0A<b>Coverage:</b> ${COVERAGE}%0A<b>Duration:</b> ${DURATION}%0A<b>Status:</b>   Success"

      - name: Notify Telegram - Failure
        if: needs.build-and-test.result == 'failure' || needs.migrate-database.result == 'failure'
        env:
          SHA: ${{ steps.info.outputs.sha_short }}
          MSG: ${{ steps.info.outputs.msg_first }}
          REPO: ${{ steps.info.outputs.repo_name }}
        run: |
          ENV_LABEL=$(if [ "${{ github.ref_name }}" = "main" ]; then echo "PRODUCTION"; else echo "DEVELOP"; fi)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="<b>❌ CI BUILD/MIGRATION FAILED [${ENV_LABEL}]</b>%0A%0A<b>Repo:</b>     ${REPO}%0A<b>Người:</b>    ${{ github.actor }}%0A<b>Nhánh:</b>    ${{ github.ref_name }} (<code>${SHA}</code>)%0A<b>Commit:</b>   ${MSG}%0A<b>Duration:</b> ${{ needs.build-and-test.outputs.duration }}%0A<b>Status:</b>   Failed"
