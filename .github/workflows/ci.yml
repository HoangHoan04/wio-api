name: CI Pipeline

on:
  push:
    branches: [develop, main]

jobs:
  build-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Telegram - In Progress
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHA_SHORT=$(echo ${COMMIT_SHA} | cut -c1-7)
          REPO_NAME=$(echo '${{ github.repository }}' | cut -d/ -f2)
          ENV_LABEL=$(if [ "${{ github.ref_name }}" = "main" ]; then echo "PRODUCTION"; else echo "DEVELOP"; fi)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="<b>🚀 CI BUILD IN PROGRESS [${ENV_LABEL}]</b>%0A%0A<b>Repo:</b>     ${REPO_NAME}%0A<b>Người:</b>    ${{ github.actor }}%0A<b>Nhánh:</b>    ${{ github.ref_name }} (<code>${SHA_SHORT}</code>)%0A<b>Status:</b>   In Progress"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Build
        run: yarn build

      - name: Prepare commit info
        id: info
        if: always()
        run: |
          echo "sha_short=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "author=${{ github.actor }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "repo_name=$(echo '${{ github.repository }}' | cut -d/ -f2)" >> $GITHUB_OUTPUT
          echo "msg_first=$(git log -1 --format=%s 2>/dev/null | tr -d '\r' | sed 's/["`$]//g' || echo 'N/A')" >> $GITHUB_OUTPUT

      - name: Notify Telegram - Success
        if: success()
        env:
          SHA: ${{ steps.info.outputs.sha_short }}
          MSG: ${{ steps.info.outputs.msg_first }}
          AUTHOR: ${{ steps.info.outputs.author }}
          BRANCH: ${{ steps.info.outputs.branch }}
          REPO: ${{ steps.info.outputs.repo_name }}
        run: |
          ENV_LABEL=$(if [ "${BRANCH}" = "main" ]; then echo "PRODUCTION"; else echo "DEVELOP"; fi)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="<b>✅ CI BUILD SUCCESS [${ENV_LABEL}]</b>%0A%0A<b>Repo:</b>     ${REPO}%0A<b>Người:</b>    ${AUTHOR}%0A<b>Nhánh:</b>    ${BRANCH} (<code>${SHA}</code>)%0A<b>Commit:</b>   ${MSG}%0A<b>Status:</b>   Success"

      - name: Notify Telegram - Failure
        if: failure()
        env:
          SHA: ${{ steps.info.outputs.sha_short }}
          MSG: ${{ steps.info.outputs.msg_first }}
          AUTHOR: ${{ steps.info.outputs.author }}
          BRANCH: ${{ steps.info.outputs.branch }}
          REPO: ${{ steps.info.outputs.repo_name }}
        run: |
          ENV_LABEL=$(if [ "${BRANCH}" = "main" ]; then echo "PRODUCTION"; else echo "DEVELOP"; fi)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="<b>❌ CI BUILD FAILED [${ENV_LABEL}]</b>%0A%0A<b>Repo:</b>     ${REPO}%0A<b>Người:</b>    ${AUTHOR}%0A<b>Nhánh:</b>    ${BRANCH} (<code>${SHA}</code>)%0A<b>Commit:</b>   ${MSG}%0A<b>Status:</b>   Failed"
