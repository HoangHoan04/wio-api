name: CD Pipeline

on:
  push:
    branches: [develop, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hoanghoan04/wio-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'main' || github.ref_name == 'production') && 'production' || 'development' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Notify Telegram - In Progress
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHA_SHORT=$(echo ${COMMIT_SHA} | cut -c1-7)
          REPO_NAME=$(echo '${{ github.repository }}' | cut -d/ -f2)
          ENV_LABEL=$(if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "production" ]; then echo "PRODUCTION"; else echo "DEVELOP"; fi)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="<b>🚀 CD DEPLOY IN PROGRESS [${ENV_LABEL}]</b>%0A%0A<b>Repo:</b>     ${REPO_NAME}%0A<b>Người:</b>    ${{ github.actor }}%0A<b>Nhánh:</b>    ${{ github.ref_name }} (<code>${SHA_SHORT}</code>)%0A<b>Image:</b>    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }}%0A<b>Status:</b>   In Progress"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ (github.ref_name == 'main' || github.ref_name == 'production') && 'latest' || 'develop' }},enable=true
            type=sha,prefix=${{ (github.ref_name == 'main' || github.ref_name == 'production') && 'prod-' || 'dev-' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOPPLER_TOKEN,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            IS_PROD=${{ github.ref_name == 'main' || github.ref_name == 'production' }}
            TARGET_DIR=$(if [ "$IS_PROD" = "true" ]; then echo "/opt/wio/prod"; else echo "/opt/wio/dev"; fi)
            TAG=$(if [ "$IS_PROD" = "true" ]; then echo "latest"; else echo "develop"; fi)
            PORT=$(if [ "$IS_PROD" = "true" ]; then echo "5001"; else echo "4001"; fi)
            CONTAINER_NAME=$(if [ "$IS_PROD" = "true" ]; then echo "wio_api_prod"; else echo "wio_api_dev"; fi)

            mkdir -p $TARGET_DIR
            cd $TARGET_DIR

            if [ -z "$DOPPLER_TOKEN" ] && [ -f "$HOME/.bashrc" ]; then
              source "$HOME/.bashrc" || true
            fi

            if [ -n "$DOPPLER_TOKEN" ]; then
              doppler secrets download --token "$DOPPLER_TOKEN" --format env --no-file > .env
            else
              doppler secrets download --format env --no-file > .env
            fi

            sed -i '/^PORT=/d' .env 2>/dev/null || true
            sed -i '/^NODE_ENV=/d' .env 2>/dev/null || true
            echo "PORT=3000" >> .env
            echo "NODE_ENV=production" >> .env

            docker network create wio_net || true
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            docker pull ghcr.io/$REPO_LOWER:$TAG
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            docker run -d \
              --name $CONTAINER_NAME \
              --restart always \
              --net wio_net \
              -p 127.0.0.1:$PORT:3000 \
              --env-file .env \
              ghcr.io/$REPO_LOWER:$TAG

      - name: Prepare commit info
        id: info
        if: always()
        run: |
          echo "sha_short=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "author=${{ github.actor }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "repo_name=$(echo '${{ github.repository }}' | cut -d/ -f2)" >> $GITHUB_OUTPUT
          echo "msg_first=$(git log -1 --format=%s 2>/dev/null | tr -d '\r' | sed 's/["`$]//g' || echo 'N/A')" >> $GITHUB_OUTPUT

      - name: Notify Telegram - Success
        if: success()
        env:
          SHA: ${{ steps.info.outputs.sha_short }}
          MSG: ${{ steps.info.outputs.msg_first }}
          AUTHOR: ${{ steps.info.outputs.author }}
          BRANCH: ${{ steps.info.outputs.branch }}
          REPO: ${{ steps.info.outputs.repo_name }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL || '' }}
        run: |
          ENV_LABEL=$(if [ "${BRANCH}" = "main" ]; then echo "PRODUCTION"; else echo "DEVELOP"; fi)
          TAG=$(if [ "${BRANCH}" = "main" ]; then echo "latest"; else echo "develop"; fi)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="<b>✅ CD DEPLOY SUCCESS [${ENV_LABEL}]</b>%0A%0A<b>Repo:</b>     ${REPO}%0A<b>Người:</b>    ${AUTHOR}%0A<b>Nhánh:</b>    ${BRANCH} (<code>${SHA}</code>)%0A<b>Image:</b>    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}%0A<b>Commit:</b>   ${MSG}%0A<b>URL:</b>      ${DEPLOY_URL}%0A<b>Status:</b>   Success"

      - name: Notify Telegram - Failure
        if: failure()
        env:
          SHA: ${{ steps.info.outputs.sha_short }}
          MSG: ${{ steps.info.outputs.msg_first }}
          AUTHOR: ${{ steps.info.outputs.author }}
          BRANCH: ${{ steps.info.outputs.branch }}
          REPO: ${{ steps.info.outputs.repo_name }}
        run: |
          ENV_LABEL=$(if [ "${BRANCH}" = "main" ]; then echo "PRODUCTION"; else echo "DEVELOP"; fi)
          TAG=$(if [ "${BRANCH}" = "main" ]; then echo "latest"; else echo "develop"; fi)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="<b>❌ CD DEPLOY FAILED [${ENV_LABEL}]</b>%0A%0A<b>Repo:</b>     ${REPO}%0A<b>Người:</b>    ${AUTHOR}%0A<b>Nhánh:</b>    ${BRANCH} (<code>${SHA}</code>)%0A<b>Image:</b>    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}%0A<b>Commit:</b>   ${MSG}%0A<b>Status:</b>   Failed"
