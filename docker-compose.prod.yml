# ──────────────────────────────────────────────────────────────
# wio-api :: docker-compose.prod.yml
# Môi trường PRODUCTION (người dùng cuối)
# Database: wio-prod
# ──────────────────────────────────────────────────────────────

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wio_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: wio-prod
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - wio_prod_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wio_redis_prod
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data_prod:/data
    networks:
      - wio_prod_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    container_name: wio_api_migration_prod
    env_file:
      - .env.prod.local
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:root@postgres:5432/wio-prod
      - TYPEORM_HOST=postgres
      - TYPEORM_PORT=5432
      - TYPEORM_USERNAME=postgres
      - TYPEORM_PASSWORD=root
      - TYPEORM_DATABASE=wio-prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wio_prod_net
    command: >
      sh -c "
        echo 'Running migrations on production database...' &&
        yarn migration:run:prod &&
        echo 'Migrations completed'
      "
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wio_api_prod
    restart: always
    env_file:
      - .env.prod.local
    environment:
      - NODE_ENV=production
      - PORT=4300
      - DATABASE_URL=postgresql://postgres:root@postgres:5432/wio-prod
      - TYPEORM_HOST=postgres
      - TYPEORM_PORT=5432
      - TYPEORM_USERNAME=postgres
      - TYPEORM_PASSWORD=root
      - TYPEORM_DATABASE=wio-prod
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - '127.0.0.1:4300:4300'
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wio_prod_net

networks:
  wio_prod_net:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
