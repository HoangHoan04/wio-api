name: wio-api

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 8
    expose:
      - '5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 8
    expose:
      - '6379'

  migration:
    image: ghcr.io/${GHCR_OWNER}/wio-api:${TAG:-latest}
    restart: 'no'
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      TYPEORM_HOST: postgres
      TYPEORM_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['tools']
    command: ['yarn', 'migration:run:prod']

  api:
    image: ghcr.io/${GHCR_OWNER}/wio-api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4300
      DATABASE_URL: ${DATABASE_URL}
      TYPEORM_HOST: postgres
      TYPEORM_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TRUST_PROXY: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:4300:4300'

volumes:
  postgres_data:
  redis_data:
