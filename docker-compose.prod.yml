# ──────────────────────────────────────────────────────────────
# wio-api :: docker-compose.prod.yml
# Môi trường PRODUCTION trên server.
# Biến môi trường được đọc từ file .env duy nhất.
# Các file env của wio-admin/wio-customer được mount để API có thể
# đọc/ghi qua giao diện Admin (EnvManager UI).
# ──────────────────────────────────────────────────────────────

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wio_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoanghoanrootpass123@}
      POSTGRES_DB: ${POSTGRES_DB:-wio-prod}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - wio_prod_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wio_redis_prod
    restart: always
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data_prod:/data
    networks:
      - wio_prod_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    container_name: wio_api_migration_prod
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:hoanghoanrootpass123@@postgres:5432/wio-prod}
      - TYPEORM_HOST=${TYPEORM_HOST:-postgres}
      - TYPEORM_PORT=${TYPEORM_PORT:-5432}
      - TYPEORM_USERNAME=${TYPEORM_USERNAME:-postgres}
      - TYPEORM_PASSWORD=${TYPEORM_PASSWORD:-hoanghoanrootpass123@}
      - TYPEORM_DATABASE=${TYPEORM_DATABASE:-wio-prod}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wio_prod_net
    command: >
      sh -c "
        echo 'Running migrations on production database...' &&
        yarn migration:run:prod &&
        echo 'Migrations completed'
      "
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wio_api_prod
    restart: always
    # TODO: Tạm chạy root để có quyền ghi file .env của wio-admin/wio-customer.
    # Sau khi phân quyền xong, chuyển về node user và set đúng file ownership.
    user: root
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4300
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:hoanghoanrootpass123@@postgres:5432/wio-prod}
      - TYPEORM_HOST=${TYPEORM_HOST:-postgres}
      - TYPEORM_PORT=${TYPEORM_PORT:-5432}
      - TYPEORM_USERNAME=${TYPEORM_USERNAME:-postgres}
      - TYPEORM_PASSWORD=${TYPEORM_PASSWORD:-hoanghoanrootpass123@}
      - TYPEORM_DATABASE=${TYPEORM_DATABASE:-wio-prod}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - ENV_MANAGER_BASE_PATH=${ENV_MANAGER_BASE_PATH:-/opt/wio}
    ports:
      - '127.0.0.1:4300:4300'
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount env files duy nhất của admin/customer/api để EnvManager UI quản lý
      - /opt/wio/wio-admin/.env:/opt/wio/wio-admin/.env
      - /opt/wio/wio-customer/.env:/opt/wio/wio-customer/.env
      - /opt/wio/wio-api/.env:/opt/wio/wio-api/.env
    networks:
      - wio_prod_net

networks:
  wio_prod_net:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
