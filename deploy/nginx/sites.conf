# ──────────────────────────────────────────────────────────────
# WIO - Nginx site configurations
#
# Thay thế tiemcuoitanthoi.id.vn bằng tên miền thật của bạn.
# Các upstream trỏ đến tên service trong docker-compose.server.yml
#
# Môi trường PRODUCTION:
#   - api.tiemcuoitanthoi.id.vn      -> wio-api-prod:4300
#   - admin.tiemcuoitanthoi.id.vn    -> wio-admin-prod:80
#   - customer.tiemcuoitanthoi.id.vn -> wio-customer-prod:2504
#
# Môi trường DEVELOP:
#   - api-dev.tiemcuoitanthoi.id.vn      -> wio-api-dev:4300
#   - admin-dev.tiemcuoitanthoi.id.vn    -> wio-admin-dev:80
#   - customer-dev.tiemcuoitanthoi.id.vn -> wio-customer-dev:2504
#
# Nếu chỉ chạy production hoặc develop, bạn có thể xóa bỏ các block
# không sử dụng.
# ──────────────────────────────────────────────────────────────

# ─── Upstreams ────────────────────────────────────────────────
# wio-api chạy trong project riêng, container_name là hostname.
# wio-admin / wio-customer chạy trong deploy/docker-compose.server.yml,
# tên service là hostname.
upstream api_prod {
    server wio_api_prod:4300 max_fails=3 fail_timeout=30s;
}

upstream api_dev {
    server wio_api_dev:4300 max_fails=3 fail_timeout=30s;
}

upstream admin_prod {
    server wio-admin-prod:80 max_fails=3 fail_timeout=30s;
}

upstream admin_dev {
    server wio-admin-dev:80 max_fails=3 fail_timeout=30s;
}

upstream customer_prod {
    server wio-customer-prod:2504 max_fails=3 fail_timeout=30s;
}

upstream customer_dev {
    server wio-customer-dev:2504 max_fails=3 fail_timeout=30s;
}

# ═══════════════════════════════════════════════════════════════
# PRODUCTION
# ═══════════════════════════════════════════════════════════════

# ─── API ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.tiemcuoitanthoi.id.vn;

    location / {
        proxy_pass http://api_prod;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Tăng giới hạn upload file
        client_max_body_size 50M;

        # Rate limit
        limit_req zone=api_limit burst=20 nodelay;
    }

    # Swagger docs
    location /api-docs {
        proxy_pass http://api_prod/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ─── Admin Frontend ───────────────────────────────────────────
server {
    listen 80;
    server_name admin.tiemcuoitanthoi.id.vn;

    location / {
        proxy_pass http://admin_prod;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://api_prod/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }
}

# ─── Customer Frontend ────────────────────────────────────────
