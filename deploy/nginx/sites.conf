# ─── Upstreams ────────────────────────────────────────────────
upstream api_dev {
    server wio_api_dev:4300 max_fails=3 fail_timeout=30s;
}

upstream admin_dev {
    server wio-admin-dev:80 max_fails=3 fail_timeout=30s;
}

upstream customer_dev {
    server wio-customer-dev:2504 max_fails=3 fail_timeout=30s;
}

# ─── HTTP: redirect to HTTPS ──────────────────────────────────
server {
    listen 80;
    server_name api-dev.tiemcuoitanthoi.id.vn admin-dev.tiemcuoitanthoi.id.vn customer-dev.tiemcuoitanthoi.id.vn;
    return 301 https://$host$request_uri;
}

# ═══════════════════════════════════════════════════════════════
# DEVELOP - HTTPS
# ═══════════════════════════════════════════════════════════════

# ─── API ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api-dev.tiemcuoitanthoi.id.vn;

    ssl_certificate /etc/letsencrypt/api-dev.tiemcuoitanthoi.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/api-dev.tiemcuoitanthoi.id.vn/privkey.pem;

    location / {
        proxy_pass http://api_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 50M;
        limit_req zone=api_limit burst=20 nodelay;
    }

    location /api-docs {
        proxy_pass http://api_dev/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ─── Admin Frontend ───────────────────────────────────────────
server {
    listen 443 ssl;
    server_name admin-dev.tiemcuoitanthoi.id.vn;

    ssl_certificate /etc/letsencrypt/api-dev.tiemcuoitanthoi.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/api-dev.tiemcuoitanthoi.id.vn/privkey.pem;

    location / {
        proxy_pass http://admin_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://api_dev/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }
}

