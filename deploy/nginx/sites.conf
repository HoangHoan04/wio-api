server {
    listen 443 ssl;
    server_name customer-dev.tiemcuoitanthoi.id.vn;

    ssl_certificate /etc/letsencrypt/api-dev.tiemcuoitanthoi.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/api-dev.tiemcuoitanthoi.id.vn/privkey.pem;

    location / {
