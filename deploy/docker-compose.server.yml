services:
  nginx:
    image: nginx:alpine
    container_name: wio_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - wio_dev_net
      - nginx_net
    depends_on:
      - wio-admin-dev
      - wio-customer-dev
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  wio-admin-dev:
    image: wio-admin:develop
    container_name: wio_admin_dev
    restart: always
    environment:
      - VITE_API_BASE_URL=https://api-dev.tiemcuoitanthoi.id.vn
      - VITE_BYPASS_AUTH=false
    networks:
      - nginx_net
      - wio_dev_net

  wio-customer-dev:
    image: wio-customer:develop
    container_name: wio_customer_dev
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://api-dev.tiemcuoitanthoi.id.vn
    networks:
      - nginx_net
      - wio_dev_net

networks:
  wio_dev_net:
    external: true
    name: wio-api_wio_dev_net
  nginx_net:
    driver: bridge
