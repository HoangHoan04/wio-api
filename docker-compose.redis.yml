version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: wio-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - wio_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wio_redis_data:
    driver: local
