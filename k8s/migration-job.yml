apiVersion: batch/v1
kind: Job
metadata:
  name: wio-api-migrate
  namespace: wio
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/YOUR_GH_OWNER/wio-api:latest
          command: ['yarn', 'migration:run:prod']
          envFrom:
            - configMapRef:
                name: wio-api
            - secretRef:
                name: wio-api
