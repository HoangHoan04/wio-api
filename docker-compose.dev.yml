# ──────────────────────────────────────────────────────────────
# wio-api :: docker-compose.dev.yml
# Môi trường DEVELOP (tester + developer)
# Database: wio-dev
# ──────────────────────────────────────────────────────────────

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wio_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hoanghoanrootpass123@
      POSTGRES_DB: wio-dev
    ports:
      - '5433:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - wio_dev_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wio_redis_dev
    restart: always
    ports:
      - '6380:6379'
    volumes:
      - redis_data_dev:/data
    networks:
      - wio_dev_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    container_name: wio_api_migration_dev
    env_file:
      - .env.dev.local
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:hoanghoanrootpass123@@postgres:5432/wio-dev
      - TYPEORM_HOST=postgres
      - TYPEORM_PORT=5432
      - TYPEORM_USERNAME=postgres
      - TYPEORM_PASSWORD=hoanghoanrootpass123@
      - TYPEORM_DATABASE=wio-dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wio_dev_net
    command: >
      sh -c "
        echo 'Running migrations on develop database...' &&
        yarn migration:run:dev &&
        echo 'Migrations completed'
      "
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wio_api_dev
    restart: always
    # TODO: Tạm chạy root để có quyền ghi file .env của wio-admin/wio-customer.
    # Sau khi phân quyền xong, chuyển về node user và set đúng file ownership.
    user: root
    env_file:
      - .env.dev.local
    environment:
      - NODE_ENV=development
      - PORT=4300
      - DATABASE_URL=postgresql://postgres:hoanghoanrootpass123@@postgres:5432/wio-dev
      - TYPEORM_HOST=postgres
      - TYPEORM_PORT=5432
      - TYPEORM_USERNAME=postgres
      - TYPEORM_PASSWORD=hoanghoanrootpass123@
      - TYPEORM_DATABASE=wio-dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENV_MANAGER_BASE_PATH=/opt/wio
    ports:
      - '4301:4300'
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount env files của admin/customer để API có thể đọc/ghi
      - /opt/wio/wio-admin/.env.development:/opt/wio/wio-admin/.env.development
      - /opt/wio/wio-admin/.env.production:/opt/wio/wio-admin/.env.production
      - /opt/wio/wio-customer/.env.development:/opt/wio/wio-customer/.env.development
      - /opt/wio/wio-customer/.env.production:/opt/wio/wio-customer/.env.production
      - /opt/wio/wio-api/.env.dev.local:/opt/wio/wio-api/.env.dev.local
      - /opt/wio/wio-api/.env.prod.local:/opt/wio/wio-api/.env.prod.local
    networks:
      - wio_dev_net

networks:
  wio_dev_net:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
